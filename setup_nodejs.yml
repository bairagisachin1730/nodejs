   - name: Create oracle client directories
     ansible.builtin.file:
       path: "{{ oracle_client_dir }}"
       state: directory
       owner: root
       group: root
       mode: '0755
       '
   - name: Download oracle client archieve
     ansible.builtin.get_url:
       url: "{{ oracle_client_url }}"
       dest: "{{ oracle_client_dir }}/{{ oracle_client_filename }}"
       mode: '0644'
       owner: root
       group: root
     register: oracle_download
   
   - name: Extract Oracle client archive
     ansible.builtin.unarchive:
       src: "{{ oracle_client_dir }}/{{ oracle_client_filename }}"
       dest:  "{{ oracle_client_dir }}"
       remote_src: true
       owner: root
       group: root

   - name: Configure oracle instant client library path
     ansible.builtin.copy:
       content: "{{ oracle_client_dir }}/{{ oracle_client_so_target }}"
       dest: /etc/ld.so.conf.d/oracle-instantclient.conf
       owner: root
       group: root
       mode: '0755'
  ## notify Run loconfig

   - name: Install redis 
     ansible.builtin.dnf:
      name: redis
      state: present

   - name: Start and enable redis
     ansible.builtin.service:
       name: redis
       state: started
       enabled: true

   - name: Deploy soar_intake systemd service file
     ansible.builtin.template:
       src: "{{ item.src }}"
       dest: "{{ item.dest }}"
       owner: soar_web
       group: root
       mode: '0600'
     loop:
      -  src: soar_intake.service.j2
         dest: /lib/systemd/system/soar_intake.service
 ## Notify reload systmed, restart soar_intake service
